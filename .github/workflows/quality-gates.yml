name: ACP quality gates

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACP_ENV: development
      ACP_SANDBOX: subprocess
      ACP_ADMIN_TOKEN: e2e-admin-token
      ACP_AUTH_SECRET: e2e-auth-secret-at-least-32-bytes
      DEEPSEEK_API_KEY: e2e-not-used

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend regression suite
        working-directory: backend
        run: python run_tests.py

      - name: Verify Alembic from an empty database
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/acp-ci-migration.db
        run: |
          rm -f /tmp/acp-ci-migration.db
          python -m alembic upgrade head
          python -m alembic check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser critical-flow smoke tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
