id: BP-ARITH-002
name: 取模判断写反（奇偶判断错）
category: arithmetic
language: python
knowledge_points: [取模运算, 条件判断]
capability_dims: [Root_Cause_Reasoning, Independent_Debug]
difficulty: L1
symptom: WA
symptom_sample: |
  程序能跑完，但把偶数挑出来的结果不对——挑出来的全是奇数
buggy_code: |
  def even_numbers(nums):
      result = []
      for n in nums:
          # 想挑出偶数
          if n % 2 == 1:
              result.append(n)
      return result

  print(even_numbers([1, 2, 3, 4, 5, 6]))
mine_location:
  file: main.py
  line: 5
trigger_input: "[1, 2, 3, 4, 5, 6]"
root_cause: "n % 2 是 n 除以 2 的余数：偶数余 0、奇数余 1。判断写成 == 1 挑的是奇数，要挑偶数应判 == 0"
cognitive_root: "把『余数等于1』当成了偶数的标志——其实偶数除以2余0，余1的是奇数"  # 认知漏洞（Timeline 🧠根因用）
thinking_pattern: control_semantics  # 跨题思维默认值归簇（聚合用）
expected_fix: "n % 2 == 0"
fix_check: 'n\s*%\s*2\s*==\s*0'
expected_output: |
  [2, 4, 6]
internalize_questions:
  - "n % 2 算的是什么？偶数和奇数分别得到几？"
  - "想挑偶数，条件应该判余数等于几？为什么？"
hint_ladder:
  L0: "运行一下，看看挑出来的是不是偶数？它们有什么共同点？"
  L1: "你想要偶数 [2,4,6]，但程序给了 [1,3,5]——挑出来的全是奇数。判断条件是不是反了？"
  L2: "问题在第5行的条件。你觉得是：A. n%2 算错了  B. ==1 这个判断  C. append 写错了？"
  L3: "n % 2 是除以2的余数。偶数除以2余几？奇数余几？你现在判的是余几？"
  L4: "看第5行 n % 2 == 1。说说它实际挑出的是哪种数，为什么和你想要的相反？"
  L5: "讲解思路：偶数除以2余0、奇数余1。要挑偶数，余数该等于几？（自己改，不要抄）"
variant_pool: []
