id: BP-LOOP-004
name: continue误用为break（提前退出写反）
category: loop
language: python
knowledge_points: [控制流, 循环]
capability_dims: [Root_Cause_Reasoning, Hypothesis_Testing]
difficulty: L2
symptom: WA
symptom_sample: |
  （不报错，但负数后面的合法成绩被丢掉了）
buggy_code: |
  def sum_valid_scores(scores):
      # 累加成绩；遇到负数说明是录入错误，跳过它继续算
      total = 0
      for s in scores:
          if s < 0:
              break        # 本意是跳过这一个，却终止了整个循环
          total += s
      return total

  print(sum_valid_scores([90, 85, -1, 70, 60]))   # 期望 305，实际 175
mine_location:
  file: main.py
  line: 6
trigger_input: "[90, 85, -1, 70, 60]"
root_cause: "break终止整个循环，continue才是跳过本次迭代——注释里的意图是'跳过这一个继续算'，用break导致-1后面的70和60全被丢弃"
expected_fix: "continue"
fix_check: 'continue'
expected_output: |
  305
internalize_questions:
  - "break 和 continue 的区别是什么？各自适用什么场景？"
  - "这个Bug为什么不报错？你是靠什么发现结果不对的？"
hint_ladder:
  L0: "运行一下，结果和期望305一致吗？差了多少？差的部分对应哪些数？"
  L1: "175 = 90 + 85——后面的70和60去哪了？它们在-1的前面还是后面？"
  L2: "问题在遇到-1之后的行为。你认为：A. total算错  B. 循环在-1处整个停了  C. 70和60没进列表？"
  L3: "break和continue都能'跳'，但跳的范围不同。注释说的意图是哪种跳法？"
  L4: "看第6行的break。它终止的是整个循环还是本次迭代？和注释的意图一致吗？"
  L5: "讲解思路：跳过当前这一个元素继续循环，用的关键字不是break。自己改。"
