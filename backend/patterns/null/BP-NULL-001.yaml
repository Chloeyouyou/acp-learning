id: BP-NULL-001
name: 对象未初始化即使用（None解引用）
category: "null"
language: python
knowledge_points: [对象生命周期, 字典]
capability_dims: [Root_Cause_Reasoning, Log_Reading]
difficulty: L2
symptom: RE
symptom_sample: |
  AttributeError: 'NoneType' object has no attribute 'append'
    File "main.py", line 8, in add_score
buggy_code: |
  class Student:
      def __init__(self, name):
          self.name = name
          self.scores = None

      def add_score(self, score):
          self.scores.append(score)
          return self.scores

  s = Student("小明")
  print(s.add_score(95))
mine_location:
  file: main.py
  line: 4
trigger_input: "任意 add_score 调用"
root_cause: "scores 字段在构造时被赋为 None 而不是空列表，第7行首次调用 append 时报错——报错行只是案发现场，根因在第4行的初始化"
cognitive_root: "以为报错那一行就是问题所在——其实根在更早的初始化没给对值"  # 认知漏洞（Timeline 🧠根因用）
thinking_pattern: crash_site  # 跨题思维默认值归簇（聚合用）
expected_fix: "self.scores = []"
fix_check: 'self\.scores\s*=\s*\[\]'
expected_output: |
  [95]
internalize_questions:
  - "为什么崩在第7行，错却在第4行？这两行是什么关系？"
  - "看到 NoneType 报错，你应该先问'谁是None'还是'哪行崩了'？为什么？"
hint_ladder:
  L0: "运行一下，把完整的报错信息读一遍。它告诉你什么对象出了问题？"
  L1: "报错说 'NoneType' object has no attribute 'append'——也就是说某个变量是None。是哪个变量？"
  L2: "scores 是 None。它是在哪里被赋值的？你认为问题在：A. add_score方法  B. __init__构造器  C. 调用方式？"
  L3: "报错的行不一定是出错的行。一个字段从什么时候开始是None的？顺着它的生命周期往前找。"
  L4: "看第4行的初始化。说说它为什么会导致第7行崩溃？"
  L5: "讲解思路：scores 在构造时被赋为 None，None 没有 append 方法。它应该被初始化成什么类型？（自己改，不要抄）"
# 变式题：同为「None 解引用」，换成方法返回 None 未检查的场景（V0.3）
variant_pool: [BP-NULL-002]
