id: BP-NULL-006
name: 字典取值漏默认值（None 参与运算）
category: "null"
language: python
knowledge_points: [字典, 对象生命周期]
capability_dims: [Root_Cause_Reasoning, Log_Reading]
difficulty: L2
symptom: RE
symptom_sample: |
  TypeError: unsupported operand type(s) for +: 'int' and 'NoneType'
    File "main.py", line 6, in <module>
buggy_code: |
  stock = {"苹果": 10, "香蕉": 5}

  # 想统计苹果和橙子的总库存
  apple = stock.get("苹果")
  orange = stock.get("橙子")
  print("总库存：", apple + orange)
mine_location:
  file: main.py
  line: 5
trigger_input: "查询不存在的键 橙子"
root_cause: "stock.get('橙子') 在键不存在时返回 None（没给默认值），第6行 10 + None 就报 TypeError——报错在第6行，根因在第5行没给 get 默认值"
cognitive_root: "以为 dict.get 取不到也会给个安全的值——其实不给默认值时它返回 None，None 不能参与运算"  # 认知漏洞（Timeline 🧠根因用）
thinking_pattern: assume_valid  # 跨题思维默认值归簇（聚合用）
expected_fix: "stock.get(\"橙子\", 0)"
fix_check: 'get\(\s*["\x27]橙子["\x27]\s*,\s*0\s*\)'
expected_output: |
  总库存： 10
internalize_questions:
  - "为什么崩在第6行，错却在第5行？orange 这个变量是什么时候变成 None 的？"
  - "dict.get 取不到键时会返回什么？怎样让它返回一个能参与计算的值？"
hint_ladder:
  L0: "运行一下，把完整报错读一遍。它说哪两种类型不能相加？"
  L1: "报错说 int 和 NoneType 不能相加——也就是 apple + orange 里有一个是 None。是哪一个？"
  L2: "orange 是 None。它是第5行 stock.get('橙子') 来的。你觉得问题在：A. 苹果那行  B. 橙子那行的 get  C. print 写法？"
  L3: "字典里根本没有'橙子'这个键。stock.get 取不到键的时候，默认会返回什么？"
  L4: "看第5行的 get。它取不到'橙子'就返回了 None。怎么让它在取不到时返回一个数字，好继续相加？"
  L5: "讲解思路：dict.get 可以接第二个参数当默认值，取不到键时返回它。想想该传什么默认值（自己改，不要抄）。"
# 变式题：同为「假设返回值有效」，换成方法返回 None 未检查的场景
variant_pool: [BP-NULL-002]
