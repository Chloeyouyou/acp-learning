id: BP-BOUNDARY-003
name: 字符串下标越界
category: boundary
language: python
knowledge_points: [字符串]
capability_dims: [Boundary_Awareness, Log_Reading]
difficulty: L1
symptom: RE
symptom_sample: |
  IndexError: string index out of range
    File "main.py", line 3, in last_char
buggy_code: |
  def last_char(s):
      # 取字符串最后一个字符
      return s[len(s)]

  print(last_char("hello"))
mine_location:
  file: main.py
  line: 3
trigger_input: '"hello"'
root_cause: "长度为n的字符串合法下标是0到n-1，s[len(s)]访问的是第n个位置，越过了末尾"
expected_fix: "s[len(s) - 1] 或 s[-1]"
fix_check: 's\[-1\]|len\(s\)\s*-\s*1'
expected_output: |
  o
internalize_questions:
  - "长度为5的字符串，最后一个字符的下标是几？为什么不是5？"
  - "Python还有什么更简洁的方式取最后一个元素？"
hint_ladder:
  L0: "运行一下，发生了什么？报错信息里说了哪个文件第几行？"
  L1: "IndexError: string index out of range——'hello'有几个字符？你在访问第几个位置？"
  L2: "问题在下标。你认为：A. len(s)算错了  B. 下标取值不对  C. 字符串本身有问题？"
  L3: "长度为n的字符串，下标范围是0到n-1。len(s)是几？它在不在这个范围里？"
  L4: "看第3行的 s[len(s)]。说说它访问的是第几个位置，为什么不行？"
  L5: "讲解思路：下标从0开始，最后一个字符的下标比长度小1。怎么改你自己写。"
# 变式题：同为「下标越界」，换成数组/循环场景（V0.3）
variant_pool: [BP-BOUNDARY-001]
