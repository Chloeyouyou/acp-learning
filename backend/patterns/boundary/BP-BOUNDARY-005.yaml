id: BP-BOUNDARY-005
name: 二分查找边界收缩错误
category: boundary
language: python
knowledge_points: [二分查找, 循环不变式]
capability_dims: [Boundary_Awareness, Hypothesis_Testing, Root_Cause_Reasoning]
difficulty: L3
symptom: HANG
symptom_sample: |
  （查找某些目标值时程序卡住不结束）
buggy_code: |
  def binary_search(arr, target):
      left, right = 0, len(arr) - 1
      while left < right:
          mid = (left + right) // 2
          if arr[mid] < target:
              left = mid
          else:
              right = mid
      return left if arr[left] == target else -1

  print(binary_search([1, 3, 5, 7, 9], 7))   # 正常
  print(binary_search([1, 3, 5, 7, 9], 9))   # 卡住
mine_location:
  file: main.py
  line: 6
trigger_input: "target=9（目标在区间右端时）"
root_cause: "left = mid 没有排除已检查过的mid。当区间缩到两个元素且目标在右边时，mid恒等于left，区间不再收缩，死循环——应为 left = mid + 1"
cognitive_root: "以为每一轮都会缩小范围，没意识到“不排除已查过的中点”会让区间卡住不动"  # 认知漏洞（Timeline 🧠根因用）
thinking_pattern: loop_progress  # 跨题思维默认值归簇（聚合用）
expected_fix: "left = mid + 1"
fix_check: 'left\s*=\s*mid\s*\+\s*1'
expected_output: |
  3
  4
internalize_questions:
  - "用 left=3, right=4 手动模拟一遍：mid是几？下一轮left和right变成什么？"
  - "二分查找保证不死循环的条件是什么？每轮迭代必须发生什么？"
  - "为什么查7正常、查9卡住？什么样的测试用例能暴露这类边界Bug？"
hint_ladder:
  L0: "两个测试一个正常一个卡住——它们的区别是什么？目标值的位置有什么特点？"
  L1: "程序卡住说明循环不退出。在循环里打印 left、right、mid，观察查9时它们怎么变化？"
  L2: "你会看到 left 和 right 停住不动了。问题在：A. mid的计算  B. left的更新  C. right的更新？"
  L3: "循环要退出，区间[left, right]必须每轮严格缩小。当 left=3, right=4 时，mid=3，执行 left=mid 后区间变了吗？"
  L4: "看第6行 left = mid。mid位置已经检查过且不是答案的一边，为什么还把它留在区间里？"
  L5: "讲解思路：arr[mid] < target 说明mid本身不可能是答案，收缩时必须把它排除出区间。怎么排除你自己改。"
